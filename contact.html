<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Porfolio Website</title>
  <link rel="stylesheet" href="style.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

  <header class="header">
    <a href="#contact" class="logo">Sadia Humaira
      <span>Salsabil</span></a>

    <i class='bx bx-menu' id="menu-icon"></i>

    <nav class="navbar">
      <a href="./index.html#home">Home</a>
      <a href="./researchprojects.html">Research & Projects</a>
      <a href="./certifications.html">Certifications</a>
      <a href="./contact.html" class="active">Contact</a>
    </nav>
  </header>




  <section class="contact" id="contact">
    <h2 class="heading">Page under construction! <span></span></h2>

    <form onsubmit="sendEmail(event)">
      <div class="input-group">
        <div class="input-box">
          <input type="text" name="user_name" placeholder="Full Name" required>
          <input type="email" name="user_email" placeholder="Email" required>
        </div>

        <div class="input-box">
          <input type="number" name="user_phone" placeholder="Phone Number">
          <input type="text" name="subject" placeholder="Subject">
        </div>
      </div>

      <div class="input-group-2">
        <textarea name="message" cols="30" rows="10" placeholder="Your Message" required></textarea>
        <input type="submit" value="Send Message" class="btn">
      </div>
    </form>
  </section>


  <footer class="footer">
    <div class="social">
      <a href="https://www.linkedin.com/in/sadia-salsabil/" target="_blank">
        <i class='bx bxl-linkedin'></i>
      </a>
      <a href="https://github.com/SadiaHumairaSalsabil/" target="_blank">
        <i class='bx bxl-github'></i>
      </a>
      <a href="https://www.facebook.com/sadiahumairasalsabil/" target="_blank">
        <i class='bx bxl-facebook-circle'></i>
      </a>
    </div>


  </footer>



  <script src="script.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("gCHqVJ1rxiaI1wSbu");
    })();

    function sendEmail(event) {
      event.preventDefault();
      emailjs.sendForm("sadiasalsabil", "template_elxtld6", event.target)
        .then(function (response) {
          alert("Message sent successfully!");
        }, function (error) {
          alert("Failed to send message. Try again or email directly to sadiahumairasalsabil@gmail.com.");
        });
    }
  </script>

</body>

</html>
